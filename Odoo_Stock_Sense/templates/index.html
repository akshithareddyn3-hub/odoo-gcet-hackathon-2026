<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSense — Inventory Control</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script></head>
<body><aside class="sidebar"><a class="brand" href="#" onclick="nav('dashboard');return false"><span class="brand-mark">S</span><span>stock<span class="brand-light">sense</span></span></a><div class="workspace-label">WORKSPACE</div><nav id="nav"><button class="nav-link active" data-page="dashboard"><i>▦</i>Dashboard</button><div class="nav-group">OPERATIONS</div><button class="nav-link" data-page="receipts"><i>↓</i>Receipts</button><button class="nav-link" data-page="deliveries"><i>↑</i>Deliveries</button><button class="nav-link" data-page="adjustments"><i>◉</i>Adjustments</button><div class="nav-group">INVENTORY</div><button class="nav-link" data-page="stock"><i>▦</i>Stock</button><button class="nav-link" data-page="ledger"><i>≋</i>Move history</button><button class="nav-link" data-page="products"><i>▤</i>Products</button><div class="nav-group">SETTINGS</div><button class="nav-link" data-page="warehouses"><i>⌂</i>Warehouses</button><button class="nav-link" data-page="locations"><i>⌖</i>Locations</button><div class="nav-group">PROFILE</div><button class="nav-link" data-page="profile"><i>♙</i>My profile</button></nav><div class="sidebar-bottom"><div class="help-card"><div class="help-icon">✦</div><b>Inventory, in sync</b><small>Keep every product moving smoothly.</small></div><div class="user-card"><div class="avatar">{{ user_name[:1]|upper }}</div><div class="user-meta"><b>{{ user_name }}</b><small>Workspace member</small></div><form method="post" action="/logout"><button class="logout" title="Logout">↗</button></form></div></div></aside>
<main class="main"><header class="topbar"><button class="mobile-menu" onclick="document.body.classList.toggle('menu-open')">☰</button><div class="crumb">Workspace <span>/</span> <b id="crumb">Dashboard</b></div><div class="top-actions"><span class="live-dot"></span><span class="sync-text">Live inventory</span><button class="icon-btn" onclick="nav('profile')" title="My profile">♙</button><div class="avatar tiny">{{ user_name[:1]|upper }}</div></div></header><div class="content"><div id="view"></div></div></main>
<div id="modal-root"></div><div id="toasts" class="toast-stack"></div><script src="/static/app.js"></script></body></html>
